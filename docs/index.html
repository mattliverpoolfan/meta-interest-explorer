<title>Meta 興趣受眾探索工具</title>
<link rel="stylesheet" href="style.css">

<div class="topbar">
  <h1>Meta 興趣受眾探索工具</h1>
  <input id="webapp-url" placeholder="貼上 Apps Script Web App URL">
  <input id="api-key" placeholder="apiKey（算重疊 / 刷新快照才需要）">
  <button id="save-config">儲存設定</button>
</div>

<div class="layout">
  <section class="panel">
    <h2>分類瀏覽</h2>
    <ul id="category-list"></ul>
  </section>

  <section class="panel">
    <h2>搜尋興趣</h2>
    <div class="searchbox">
      <input id="search-input" placeholder="輸入關鍵字，例如「跑步」">
      <button id="search-btn" class="primary">搜尋</button>
    </div>
    <ul id="search-results"></ul>
    <div id="search-status" class="status"></div>

    <h2 style="margin-top:20px">相關建議</h2>
    <ul id="suggestion-list"></ul>
  </section>

  <section class="panel">
    <h2>工作清單</h2>
    <div id="worklist"></div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button id="compute-overlap-btn">算重疊</button>
      <button id="copy-for-ai-btn" class="primary">複製給 AI</button>
    </div>
    <table id="overlap-matrix" style="display:none"></table>
    <div id="worklist-status" class="status"></div>
  </section>
</div>

<script src="app.js"></script>
